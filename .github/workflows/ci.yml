name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NEXT_PUBLIC_API_URL: https://api.example.invalid

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions fixadas por SHA (o Dependabot atualiza).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7

  # Os tipos da API precisam bater com o contrato publicado pelo backend (openapi.json no main).
  contrato-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tipos gerados do openapi.json do backend
        run: |
          npx openapi-typescript \
            https://raw.githubusercontent.com/pedrofurtadoflores/personal-ai-backend/main/openapi.json \
            -o src/lib/api-schema.d.ts
          if ! git diff --exit-code src/lib/api-schema.d.ts; then
            echo "Os tipos da API estão desatualizados: rode npm run api:types e faça commit."
            exit 1
          fi
